version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dragon-city-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: dragon-city-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

volumes:
  mongo_data:
